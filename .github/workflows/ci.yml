name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: go ${{ matrix.go }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # "1.24" is the go directive of go.mod, the lowest supported version. "stable" is the
        # newest Go release, "oldstable" is the one before it.
        go: ["1.24", oldstable, stable]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ matrix.go }}
          # The module has no dependencies, so there is no go.sum to key a cache on.
          cache: false
      - name: Go version
        run: go version
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "$out"; echo "gofmt: run 'gofmt -w .'"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: go mod tidy
        run: go mod tidy -diff
      - name: test
        run: go test -race -shuffle=on -cover -count=1 ./...
      - name: staticcheck
        if: matrix.go == 'stable'
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      - name: govulncheck
        if: matrix.go == 'stable'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
          cache: false
      # golangci/golangci-lint-action v9.3.0
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.15.0
